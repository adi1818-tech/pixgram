{% extends "base.html" %}
{% block title %}Sign Up — Pixgram{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="card auth-card">
      <span class="auth-logo">Pixgram</span>
      <p class="auth-tagline">Sign up to see photos from your friends.</p>

      <form method="POST">
        <div class="form-group">
          <input type="text" name="username" placeholder="Username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <input type="password" name="password" placeholder="Password" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-full">Sign Up</button>
      </form>
    </div>
    <div class="card auth-alt">
      Already have an account?
      <a href="{{ url_for('login') }}">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
